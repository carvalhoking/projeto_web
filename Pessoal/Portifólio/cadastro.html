<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistema de Cadastro — Gustavo Carvalho</title>
  <meta name="description" content="Sistema de cadastro desenvolvido por Gustavo Carvalho" />

  <!-- Fonte Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    :root {
      --bg: #0a0a0a;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --line: #1e293b;
      --accent: #3b82f6;
      --accent-2: #1d4ed8;
      --card: #111827;
      --card-hover: #1f2937;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --radius: 16px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body.light {
      --bg: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --line: #e2e8f0;
      --card: #f8fafc;
      --card-hover: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Poppins", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      padding: 20px 0;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: var(--muted);
      font-size: 1.1rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      text-decoration: none;
      margin-bottom: 20px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .back-link:hover {
      transform: translateX(-5px);
    }

    .main-content {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
    }

    @media (min-width: 1024px) {
      .main-content {
        grid-template-columns: 1fr 1.5fr;
      }
    }

    .form-section,
    .list-section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 30px;
      transition: all 0.3s ease;
    }

    .form-section:hover,
    .list-section:hover {
      background: var(--card-hover);
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-weight: 500;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .form-group input.error {
      border-color: var(--error);
    }

    .error-message {
      color: var(--error);
      font-size: 0.85rem;
      margin-top: 5px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
    }

    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .btn-secondary:hover {
      background: var(--card-hover);
      border-color: var(--accent);
    }

    .btn-danger {
      background: var(--error);
      color: white;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-success:hover {
      background: #059669;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .users-list {
      max-height: 600px;
      overflow-y: auto;
    }

    .user-card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }

    .user-card:hover {
      border-color: var(--accent);
      transform: translateX(5px);
    }

    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
    }

    .user-info h3 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--text);
    }

    .user-info p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 3px;
    }

    .user-actions {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      padding: 8px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state i {
      font-size: 4rem;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 5px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .success-message {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--success);
      color: var(--success);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2rem;
      }

      .main-content {
        grid-template-columns: 1fr;
      }

      .user-header {
        flex-direction: column;
        gap: 15px;
      }

      .user-actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">
      <i data-lucide="arrow-left" width="18" height="18"></i>
      Voltar ao Portfólio
    </a>

    <div class="header">
      <h1>Sistema de Cadastro</h1>
      <p>Gerencie usuários de forma simples e eficiente</p>
    </div>

    <div class="main-content">
      <!-- Formulário de Cadastro -->
      <div class="form-section">
        <h2 class="section-title">
          <i data-lucide="user-plus" width="24" height="24"></i>
          Cadastrar Usuário
        </h2>

        <div class="success-message" id="successMessage">
          <i data-lucide="check-circle" width="18" height="18"></i>
          Usuário cadastrado com sucesso!
        </div>

        <form id="cadastroForm">
          <div class="form-group">
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" name="nome" required placeholder="Digite o nome completo">
            <span class="error-message" id="nomeError"></span>
          </div>

          <div class="form-group">
            <label for="email">E-mail *</label>
            <input type="email" id="email" name="email" required placeholder="exemplo@email.com">
            <span class="error-message" id="emailError"></span>
          </div>

          <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999">
            <span class="error-message" id="telefoneError"></span>
          </div>

          <div class="form-group">
            <label for="idade">Idade</label>
            <input type="number" id="idade" name="idade" min="1" max="120" placeholder="Digite a idade">
            <span class="error-message" id="idadeError"></span>
          </div>

          <div class="form-group">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" placeholder="Digite a cidade">
          </div>

          <div class="form-group">
            <label for="profissao">Profissão</label>
            <input type="text" id="profissao" name="profissao" placeholder="Digite a profissão">
          </div>

          <div class="btn-group">
            <button type="submit" class="btn btn-primary">
              <i data-lucide="save" width="18" height="18"></i>
              Cadastrar
            </button>
            <button type="button" class="btn btn-secondary" id="btnLimpar">
              <i data-lucide="x" width="18" height="18"></i>
              Limpar
            </button>
          </div>
        </form>
      </div>

      <!-- Lista de Usuários -->
      <div class="list-section">
        <h2 class="section-title">
          <i data-lucide="users" width="24" height="24"></i>
          Usuários Cadastrados
        </h2>

        <div class="stats">
          <div class="stat-card">
            <div class="stat-number" id="totalUsers">0</div>
            <div class="stat-label">Total</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="todayUsers">0</div>
            <div class="stat-label">Hoje</div>
          </div>
        </div>

        <div class="users-list" id="usersList">
          <div class="empty-state">
            <i data-lucide="users" width="64" height="64"></i>
            <p>Nenhum usuário cadastrado ainda.</p>
            <p style="margin-top: 10px; font-size: 0.9rem;">Cadastre o primeiro usuário usando o formulário ao lado.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Inicializar ícones Lucide
    lucide.createIcons();

    // Gerenciamento de dados
    let users = JSON.parse(localStorage.getItem('cadastroUsers')) || [];
    let editingId = null;

    // Formatação de telefone
    document.getElementById('telefone').addEventListener('input', function(e) {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length <= 11) {
        if (value.length <= 10) {
          value = value.replace(/(\d{2})(\d{4})(\d{4})/, '($1) $2-$3');
        } else {
          value = value.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
        }
        e.target.value = value;
      }
    });

    // Validação de email
    function validateEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(email);
    }

    // Limpar erros
    function clearErrors() {
      document.querySelectorAll('.error-message').forEach(el => {
        el.classList.remove('show');
        el.textContent = '';
      });
      document.querySelectorAll('.form-group input').forEach(el => {
        el.classList.remove('error');
      });
    }

    // Mostrar erro
    function showError(fieldId, message) {
      const field = document.getElementById(fieldId);
      const errorEl = document.getElementById(fieldId + 'Error');
      field.classList.add('error');
      errorEl.textContent = message;
      errorEl.classList.add('show');
    }

    // Salvar usuário
    function saveUser(userData) {
      const user = {
        id: editingId || Date.now().toString(),
        ...userData,
        dataCadastro: editingId ? users.find(u => u.id === editingId).dataCadastro : new Date().toISOString(),
        dataAtualizacao: new Date().toISOString()
      };

      if (editingId) {
        const index = users.findIndex(u => u.id === editingId);
        users[index] = user;
        editingId = null;
      } else {
        users.push(user);
      }

      localStorage.setItem('cadastroUsers', JSON.stringify(users));
      renderUsers();
      updateStats();
      
      // Mostrar mensagem de sucesso
      const successMsg = document.getElementById('successMessage');
      successMsg.textContent = editingId ? 'Usuário atualizado com sucesso!' : 'Usuário cadastrado com sucesso!';
      successMsg.classList.add('show');
      setTimeout(() => {
        successMsg.classList.remove('show');
      }, 3000);
    }

    // Renderizar usuários
    function renderUsers() {
      const listEl = document.getElementById('usersList');
      
      if (users.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <i data-lucide="users" width="64" height="64"></i>
            <p>Nenhum usuário cadastrado ainda.</p>
            <p style="margin-top: 10px; font-size: 0.9rem;">Cadastre o primeiro usuário usando o formulário ao lado.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      listEl.innerHTML = users.map(user => `
        <div class="user-card">
          <div class="user-header">
            <div class="user-info">
              <h3>${user.nome}</h3>
              <p><i data-lucide="mail" width="14" height="14"></i> ${user.email}</p>
              ${user.telefone ? `<p><i data-lucide="phone" width="14" height="14"></i> ${user.telefone}</p>` : ''}
              ${user.idade ? `<p><i data-lucide="calendar" width="14" height="14"></i> ${user.idade} anos</p>` : ''}
              ${user.cidade ? `<p><i data-lucide="map-pin" width="14" height="14"></i> ${user.cidade}</p>` : ''}
              ${user.profissao ? `<p><i data-lucide="briefcase" width="14" height="14"></i> ${user.profissao}</p>` : ''}
            </div>
            <div class="user-actions">
              <button class="btn btn-success btn-icon" onclick="editUser('${user.id}')" title="Editar">
                <i data-lucide="edit" width="18" height="18"></i>
              </button>
              <button class="btn btn-danger btn-icon" onclick="deleteUser('${user.id}')" title="Excluir">
                <i data-lucide="trash-2" width="18" height="18"></i>
              </button>
            </div>
          </div>
        </div>
      `).join('');
      
      lucide.createIcons();
    }

    // Editar usuário
    function editUser(id) {
      const user = users.find(u => u.id === id);
      if (!user) return;

      editingId = id;
      document.getElementById('nome').value = user.nome || '';
      document.getElementById('email').value = user.email || '';
      document.getElementById('telefone').value = user.telefone || '';
      document.getElementById('idade').value = user.idade || '';
      document.getElementById('cidade').value = user.cidade || '';
      document.getElementById('profissao').value = user.profissao || '';

      // Atualizar botão
      const submitBtn = document.querySelector('#cadastroForm button[type="submit"]');
      submitBtn.innerHTML = '<i data-lucide="save" width="18" height="18"></i> Atualizar';
      lucide.createIcons();

      // Scroll para o formulário
      document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
    }

    // Excluir usuário
    function deleteUser(id) {
      if (confirm('Tem certeza que deseja excluir este usuário?')) {
        users = users.filter(u => u.id !== id);
        localStorage.setItem('cadastroUsers', JSON.stringify(users));
        renderUsers();
        updateStats();
      }
    }

    // Atualizar estatísticas
    function updateStats() {
      const total = users.length;
      const today = new Date().toDateString();
      const todayCount = users.filter(u => {
        const cadastroDate = new Date(u.dataCadastro).toDateString();
        return cadastroDate === today;
      }).length;

      document.getElementById('totalUsers').textContent = total;
      document.getElementById('todayUsers').textContent = todayCount;
    }

    // Limpar formulário
    document.getElementById('btnLimpar').addEventListener('click', function() {
      document.getElementById('cadastroForm').reset();
      clearErrors();
      editingId = null;
      const submitBtn = document.querySelector('#cadastroForm button[type="submit"]');
      submitBtn.innerHTML = '<i data-lucide="save" width="18" height="18"></i> Cadastrar';
      lucide.createIcons();
    });

    // Submeter formulário
    document.getElementById('cadastroForm').addEventListener('submit', function(e) {
      e.preventDefault();
      clearErrors();

      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim();
      const telefone = document.getElementById('telefone').value.trim();
      const idade = document.getElementById('idade').value;
      const cidade = document.getElementById('cidade').value.trim();
      const profissao = document.getElementById('profissao').value.trim();

      // Validações
      let hasError = false;

      if (!nome || nome.length < 3) {
        showError('nome', 'Nome deve ter pelo menos 3 caracteres');
        hasError = true;
      }

      if (!email || !validateEmail(email)) {
        showError('email', 'E-mail inválido');
        hasError = true;
      }

      // Verificar email duplicado
      if (!editingId && users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
        showError('email', 'Este e-mail já está cadastrado');
        hasError = true;
      }

      if (idade && (idade < 1 || idade > 120)) {
        showError('idade', 'Idade deve estar entre 1 e 120 anos');
        hasError = true;
      }

      if (hasError) return;

      // Salvar
      saveUser({
        nome,
        email,
        telefone: telefone || null,
        idade: idade || null,
        cidade: cidade || null,
        profissao: profissao || null
      });

      // Limpar formulário
      document.getElementById('cadastroForm').reset();
      editingId = null;
      const submitBtn = document.querySelector('#cadastroForm button[type="submit"]');
      submitBtn.innerHTML = '<i data-lucide="save" width="18" height="18"></i> Cadastrar';
      lucide.createIcons();
    });

    // Inicializar
    renderUsers();
    updateStats();
  </script>
</body>
</html>
